<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>
// Применяем сохранённую тему как можно раньше — до отрисовки, чтобы не
// было вспышки дефолтной темы при перезаходе на сайт.
(function(){
  try{
    var saved = localStorage.getItem('schedule-theme-andrey-anya');
    if(saved){
      document.documentElement.setAttribute('data-theme', saved);
    } else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
      // No explicit choice yet — follow the system scheme by default
      // (light → terracotta) instead of always opening in dark mocha.
      document.documentElement.setAttribute('data-theme', 'terracotta');
    }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1512" id="themeColorMeta">
<title>Табло — Андрей и Аня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Мокко — базовая тема (без data-theme), тёмная: эспрессо-шоколад +
     карамель + бордо, в духе трендов 2026 (Pantone Mocha Mousse,
     Benjamin Moore Silhouette). */
  :root{
    color-scheme: dark;
    --bg: #1a1512;
    --panel: #241d17;
    --panel-2: #2c231c;
    --line: #3d3025;
    --andrey: #d3a86a;
    --andrey-dim: #a17f4d;
    --andrey-soft: rgba(211,168,106,0.12);
    --anya: #d1657b;
    --anya-dim: #9c4b5c;
    --anya-soft: rgba(209,101,123,0.15);
    --text: #f0e4d4;
    --text-dim: #a4907a;
    --free: #8fbf7a;
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.6);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  /* Терракота — светлая, глина/хаки + терракотовый (в духе трендов 2026:
     Universal Khaki, terracotta & clay). */
  :root[data-theme="terracotta"]{
    color-scheme: light;
    --bg: #f1e3d0;
    --panel: #faf3e6;
    --panel-2: #ecdcc3;
    --line: #ddc6a4;
    --andrey: #6b5a3a;
    --andrey-dim: #8f7c56;
    --andrey-soft: rgba(107,90,58,0.10);
    --anya: #a34b2b;
    --anya-dim: #7b3921;
    --anya-soft: rgba(163,75,43,0.12);
    --text: #382d1e;
    --text-dim: #6c5e4a;
    --free: #516839;
    --shadow: 0 10px 26px -14px rgba(90,55,20,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 28px 16px 60px;
    -webkit-font-smoothing: antialiased;
    transition: background-color .4s var(--ease), color .3s var(--ease);
  }
  .wrap{max-width: 800px; margin: 0 auto;}

  /* Раньше здесь было общее правило transition с !important на несколько
     селекторов сразу. В CSS !important заменяет ВЕСЬ список transition-свойств
     целиком, а не объединяется с локальными правилами — из-за этого подъём
     карточек при hover, пульсация активной даты и подсветка "текущей пары"
     переставали анимироваться. Теперь каждый селектор ниже сам перечисляет
     полный список нужных ему transition-свойств (цвета темы + свои эффекты). */

  @keyframes dropIn{
    from{ opacity:0; transform: translateY(-10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes slotIn{
    from{ opacity:0; transform: translateY(12px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes pillPop{
    0%{ transform: scale(.90); }
    55%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .drop-in{
    opacity:0;
    animation: dropIn .45s var(--ease) forwards;
    will-change: opacity, transform;
  }
  .drop-in.d1{ animation-delay: .04s; }
  .drop-in.d2{ animation-delay: .1s; }
  .drop-in.d3{ animation-delay: .16s; }
  .rise-in{
    opacity:0;
    animation: riseIn .45s var(--ease) forwards;
    will-change: opacity, transform;
  }
  .rise-in.d1{ animation-delay: .14s; }
  .rise-in.d2{ animation-delay: .2s; }
  .rise-in.d3{ animation-delay: .26s; }

  .board-header{
    text-align:center;
    padding: 6px 10px 26px;
    margin-bottom: 20px;
    position:relative;
  }
  .board-header::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    transform: translateX(-50%);
    width:64px; height:2px;
    background: linear-gradient(90deg, var(--andrey), var(--anya));
    border-radius: 2px;
    opacity:.55;
    transition: background-image .35s var(--ease);
  }
  .board-header .kicker{
    letter-spacing: 2.5px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight:600;
    text-transform:uppercase;
  }
  .board-header h1{
    font-weight: 800;
    font-size: clamp(26px, 6vw, 36px);
    margin: 8px 0 6px;
    letter-spacing: 0.5px;
    background: linear-gradient(100deg, var(--andrey) 20%, var(--text) 55%, var(--anya) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: background-image .4s var(--ease);
  }
  .board-header p{
    margin:0;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .theme-switcher{
    margin-top: 16px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 9px;
  }
  .theme-swatch{
    position: relative;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    padding: 0;
    cursor: pointer;
    background: var(--panel-2);
    background-clip: padding-box;
    transition: border-color .25s var(--ease), transform .15s var(--ease), box-shadow .25s var(--ease);
  }
  /* Same invisible hit-area bump as the menu tabs: keeps the 26px swatch
     visually small while giving it a 44px tap target. */
  .theme-swatch::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:max(44px, 100%);
    height:max(44px, 100%);
    transform:translate(-50%,-50%);
  }
  .theme-swatch:hover{ transform: translateY(-2px) scale(1.06); will-change: transform; }
  .theme-swatch:active{ transform: translateY(0) scale(.94); }
  .theme-swatch.active{
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text-dim);
  }

  .date-rail{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 4px 2px 14px;
    margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .date-rail::-webkit-scrollbar{ display:none; }
  .date-pill{
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 13px;
    border-radius: 10px;
    cursor: pointer;
    text-align:center;
    line-height:1.3;
    transition: border-color .25s var(--ease), color .25s var(--ease), transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s var(--ease), background-color .25s var(--ease);
  }
  .date-pill:hover{ transform: translateY(-3px); border-color: var(--andrey-dim); }
  .date-pill:active{ transform: translateY(0) scale(.96); }
  .date-pill b{display:block; font-size:15.5px; color: var(--text); font-weight:700; transition: color .25s var(--ease);}
  .date-pill.active{
    border-color: var(--andrey);
    color: var(--andrey);
    background: var(--andrey-soft);
    box-shadow: 0 6px 16px -8px rgba(0,0,0,0.35);
  }
  .date-pill.active b{color: var(--andrey);}
  .date-pill.off b{color: var(--text-dim);}
  .date-pill.pop{ animation: pillPop .4s cubic-bezier(.34,1.56,.64,1); }

  .day-title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin: 0 0 18px;
    position:relative;
  }
  .day-title{
    font-size: 14.5px;
    font-weight:600;
    color: var(--text-dim);
    text-align:center;
    margin: 0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .today-btn{
    position:absolute;
    right:0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 20px;
    font-family:inherit;
    font-size: 11px;
    font-weight:700;
    letter-spacing: .3px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform: translateY(-50%) scale(.9);
    top:50%;
    transition: opacity .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
  }
  .today-btn.show{
    opacity:1;
    pointer-events:auto;
    transform: translateY(-50%) scale(1);
  }
  .today-btn:hover{ color: var(--text); border-color: var(--andrey-dim); }
  .today-btn:active{ transform: translateY(-50%) scale(.94); }
  .today-btn::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:max(44px, 100%);
    height:max(44px, 100%);
    transform:translate(-50%,-50%);
  }

  .date-pill{ position:relative; }
  /* Точка "сегодня": статичная точка (::after) + пульсирующее кольцо (::before).
     Кольцо анимируется только через transform/opacity — это чистый композитинг
     (без перерисовки каждый кадр), в отличие от прежней анимации box-shadow,
     которая к тому же была жёстко завязана на цвет тёмной темы. */
  .date-pill.today::after{
    content:"";
    position:absolute;
    top:6px; right:6px;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--anya);
    z-index:1;
    transition: background-color .3s var(--ease);
  }
  .date-pill.today::before{
    content:"";
    position:absolute;
    top:6px; right:6px;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--anya);
    animation: todayPulse 2.2s ease-out infinite;
    will-change: transform, opacity;
    transition: background-color .3s var(--ease);
  }
  .date-pill.today.active::after,
  .date-pill.today.active::before{ background: var(--bg); }
  @keyframes todayPulse{
    0%{ transform: scale(1); opacity:.5; }
    70%{ transform: scale(2.6); opacity:0; }
    100%{ transform: scale(2.6); opacity:0; }
  }

  .content-swap{
    transition: opacity .26s var(--ease), transform .26s var(--ease);
  }
  .content-swap.swapping{ opacity:0; transform: translateY(6px) scale(.99); }

  .columns{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 560px){
    .columns{grid-template-columns: 1fr;}
  }

  .col{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
    box-shadow: var(--shadow);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), background-color .35s var(--ease), border-color .35s var(--ease);
  }
  .col:hover{
    transform: translateY(-3px);
    box-shadow: 0 16px 34px -14px rgba(0,0,0,0.5);
  }
  .col-head{
    padding: 13px 16px;
    font-weight:700;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
  }
  .col-head{
    transition: color .3s var(--ease);
  }
  .col-head::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:3px;
    transition: background-image .35s var(--ease);
  }
  .col.andrey .col-head{ color: var(--andrey); }
  .col.andrey .col-head::before{ background: linear-gradient(90deg, var(--andrey-dim), var(--andrey)); }
  .col.anya .col-head{ color: var(--anya); }
  .col.anya .col-head::before{ background: linear-gradient(90deg, var(--anya-dim), var(--anya)); }
  .col-head .free-tag{
    font-size:11px;
    color: var(--free);
    font-weight:600;
  }

  .slot{
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    font-size: 13px;
    display:flex;
    gap:10px;
    cursor: pointer;
    animation: slotIn .4s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 0.045s);
    will-change: opacity, transform;
    transition: background-color .3s var(--ease), border-left-color .3s var(--ease), padding-left .3s var(--ease);
  }
  .slot:hover{ background: var(--panel-2); }
  .slot:last-child{border-bottom:none;}
  .slot.now{
    background: var(--anya-soft);
    border-left-color: var(--anya);
    padding-left: 13px;
  }
  .slot.now .time{ color: var(--anya); }
  .slot.now .time::after{
    content: "сейчас";
    display:block;
    margin-top:3px;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color: var(--anya);
    animation: fadePulse 1.8s ease-in-out infinite;
  }
  .slot.past{ opacity:.5; }
  @keyframes fadePulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.45; }
  }
  .slot .time{
    color: var(--text-dim);
    flex: 0 0 84px;
    font-size:12px;
    font-weight:600;
    padding-top:1px;
  }
  .slot .what b{display:block; color: var(--text); font-size:13px; font-weight:600;}
  .slot .what span{color: var(--text-dim); font-size:12px;}
  .empty-day{
    padding: 26px 14px;
    text-align:center;
    color: var(--free);
    font-size:13px;
    font-weight:600;
    animation: slotIn .45s var(--ease) both;
  }

  .meet-note{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 26px;
    box-shadow: var(--shadow);
    animation: slotIn .45s var(--ease) both;
    animation-delay: .1s;
    transition: background-color .35s var(--ease), border-color .35s var(--ease), color .3s var(--ease);
  }
  .meet-note b{color: var(--text); transition: color .3s var(--ease);}

  .menu-board{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 16px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    transition: background-color .35s var(--ease), border-color .35s var(--ease);
  }
  .menu-board h2{
    font-size: 13.5px;
    letter-spacing:1px;
    color: var(--andrey);
    margin: 0 0 4px;
    font-weight:800;
    transition: color .3s var(--ease);
  }
  .menu-sub{
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 14px;
    line-height: 1.5;
    transition: color .3s var(--ease);
  }
  .menu-tabs{
    position:relative;
    display:flex;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
    transition: background-color .35s var(--ease), border-color .35s var(--ease);
  }
  .menu-tab-indicator{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width: calc((100% - 8px) / 3);
    background: var(--anya);
    border-radius: 8px;
    transition: transform .35s var(--ease);
    z-index:0;
  }
  .menu-tab{
    position:relative;
    z-index:1;
    flex:1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 12px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition: color .35s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .menu-tab.active{ color: var(--bg); }
  /* Invisible hit-area bump: the tab bar is compact (~32px tall visually),
     under the 44px minimum that WCAG 2.5.8, Apple HIG and Material Design
     all recommend for touch targets. Expanding via ::after keeps the tidy
     visual height while widening what actually responds to a tap. */
  .menu-tab::after{
    content:"";
    position:absolute;
    top:50%; left:0; right:0;
    height:max(44px, 100%);
    transform:translateY(-50%);
  }
  .menu-list{
    max-height: 340px;
    overflow-y: auto;
    border-top: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent;
  }
  .menu-list::-webkit-scrollbar{width:6px;}
  .menu-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .menu-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    font-size: 13px;
    transition: background-color .25s var(--ease), border-left-color .25s var(--ease), opacity .25s var(--ease);
    -webkit-tap-highlight-color: transparent;
    animation: slotIn .35s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 0.02s);
  }
  .menu-row:hover{ background: var(--panel-2); }
  .menu-row.past{ opacity: .4; }
  .menu-row.next{
    background: var(--anya-soft);
    border-left-color: var(--anya);
  }
  .menu-row.next .dep{ color: var(--anya); }
  .menu-row .soon-tag{
    flex: 0 0 auto;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
    color: var(--anya);
    background: var(--anya-soft);
    padding: 2px 6px;
    border-radius: 6px;
    animation: fadePulse 1.8s ease-in-out infinite;
  }
  .menu-row .num{
    flex: 0 0 52px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight:600;
  }
  .menu-row .dep{
    flex: 0 0 52px;
    font-weight:700;
    color: var(--andrey);
  }
  .menu-row .arrow{ color: var(--text-dim); flex: 0 0 14px; text-align:center;}
  .menu-row .arr{
    flex: 0 0 52px;
    font-weight:700;
    color: var(--anya);
  }
  .menu-row .dest{
    flex: 1;
    color: var(--text-dim);
    font-size: 12px;
    text-align:right;
  }
  .menu-row .alab{
    flex: 0 0 20px;
    font-size: 13px;
    text-align:center;
  }
  .menu-row .alab.yes{ color: var(--free); }
  .menu-row .alab.no{ color: var(--text-dim); }
  /* Detail sheet — opens when a class/pair is tapped. Not full-screen:
     capped height, slides up from the bottom, easy to dismiss by tapping
     the scrim, swiping down on the grabber, the close button, or Esc. */
  .sheet-scrim{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s var(--ease);
    z-index: 998;
  }
  .sheet-scrim.open{ opacity:1; pointer-events:auto; }

  .detail-sheet{
    position: fixed;
    left: 50%;
    bottom: 0;
    width: min(92vw, 460px);
    max-height: 62vh;
    transform: translate(-50%, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -14px 40px -12px rgba(0,0,0,0.5);
    padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
    z-index: 999;
    transition: transform .32s cubic-bezier(.22,1,.36,1);
  }
  .detail-sheet.open{ transform: translate(-50%, 0); }
  .detail-sheet.dragging{ transition: none; }
  .detail-sheet.andrey .sheet-time{ color: var(--andrey); }
  .detail-sheet.anya .sheet-time{ color: var(--anya); }
  .detail-sheet.andrey .sheet-meta span::before{ background: var(--andrey); }
  .detail-sheet.anya .sheet-meta span::before{ background: var(--anya); }

  .sheet-grabber{
    width: 40px;
    height: 4px;
    border-radius: 3px;
    background: var(--line);
    margin: 4px auto 14px;
    cursor: grab;
    touch-action: none;
  }
  .sheet-close{
    position: absolute;
    top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .sheet-close:hover{ color: var(--text); border-color: var(--andrey-dim); }
  .sheet-close:active{ transform: scale(.92); }
  .sheet-close::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:max(44px, 100%);
    height:max(44px, 100%);
    transform:translate(-50%,-50%);
  }
  .sheet-body{

function todayISO(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const TODAY = todayISO();

// Open on today's date automatically; if today falls outside the printed
// range, fall back to the nearest edge (first date before it starts, last
// date once it's over) instead of always showing day one.
function pickInitialDate(){
  if(dateList.some(([iso])=>iso===TODAY)) return TODAY;
  if(TODAY < dateList[0][0]) return dateList[0][0];
  return dateList[dateList.length-1][0];
}
let currentDate = pickInitialDate();

function weekdayIndex(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.getDay();
}

function lastEnd(items){
  if(!items || items.length===0) return null;
  const last = items[items.length-1];
  const parts = last.t.split("–");
  return parts.length===2 ? parts[1].trim() : null;
}

function freeTagText(items, allDayFreeText, busyAllDayText){
  if(items.length===0) return allDayFreeText;
  const end = lastEnd(items);
  return end ? `до ${end}` : busyAllDayText;
}

function buildRail(){
  const frag = document.createDocumentFragment();
  dateList.forEach(([iso,label,wd])=>{
    const pill = document.createElement('div');
    pill.className = 'date-pill'
      + (iso===currentDate ? ' active':'')
      + ((wd==="Сб"||wd==="Вс")?' off':'')
      + (iso===TODAY ? ' today':'');
    pill.dataset.iso = iso;
    pill.setAttribute('role','tab');
    pill.setAttribute('aria-selected', iso===currentDate ? 'true':'false');
    pill.tabIndex = iso===currentDate ? 0 : -1;
    pill.title = iso===TODAY ? `${label} — сегодня` : label;
    pill.innerHTML = `<b>${label}</b>${wd}`;
    pill.onclick = ()=>{ if(iso!==currentDate){ currentDate = iso; goToDate(); } };
    pill.onkeydown = (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pill.click(); }
    };
    frag.appendChild(pill);
  });
  dom.rail.innerHTML = "";
  dom.rail.appendChild(frag);
}

function replayAnim(el){
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

function updateActivePill(){
  const focusWasInRail = dom.rail.contains(document.activeElement);
  dom.rail.querySelectorAll('.date-pill').forEach(p=>{
    const isActive = p.dataset.iso === currentDate;
    p.classList.toggle('active', isActive);
    p.setAttribute('aria-selected', isActive ? 'true':'false');
    p.tabIndex = isActive ? 0 : -1;
  });
  const activePill = dom.rail.querySelector('.date-pill.active');
  if(activePill){
    replayAnim(activePill);
    activePill.classList.remove('pop');
    void activePill.offsetWidth;
    activePill.classList.add('pop');
    activePill.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    // Keep keyboard focus on the rail following the selection (roving
    // tabindex pattern) instead of leaving it stranded on a now
    // unfocusable pill when navigation was driven by the arrow keys.
    if(focusWasInRail) activePill.focus({preventScroll:true});
  }
  dom.todayBtn.classList.toggle('show', currentDate !== TODAY);
}

function goToDate(){
  updateActivePill();
  dom.daySwap.classList.add('swapping');
  window.setTimeout(()=>{
    render();
    requestAnimationFrame(()=>{ dom.daySwap.classList.remove('swapping'); });
  }, 220);
}

function jumpToToday(){
  const target = pickInitialDate();
  if(target !== currentDate){
    currentDate = target;

// Left/right arrow keys move between days — handy once you're scrolled
// away from the rail, and costs nothing for mouse/touch users.
document.addEventListener('keydown', e=>{
  if(e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const idx = dateList.findIndex(d=>d[0]===currentDate);
  const next = idx + (e.key==='ArrowRight' ? 1 : -1);
  if(next < 0 || next >= dateList.length) return;
  currentDate = dateList[next][0];
  goToDate();
});

// Minutes-since-midnight helper used to work out what's happening "now".
function minutesNow(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function parseRange(t){
  const parts = t.split("–");
  if(parts.length!==2) return null;
  const [sh,sm] = parts[0].split(":").map(Number);
  const [eh,em] = parts[1].split(":").map(Number);
  if([sh,sm,eh,em].some(Number.isNaN)) return null;
  return [sh*60+sm, eh*60+em];
}

let dayItems = { andrey: [], anya: [] };

function renderSlots(container, items, emptyText, person){
  if(items.length===0){
    container.innerHTML = `<div class="empty-day">${emptyText}</div>`;
    return;
  }
  const isToday = currentDate === TODAY;
  const now = isToday ? minutesNow() : null;
  container.innerHTML = items.map((it,i)=>{
    const range = isToday ? parseRange(it.t) : null;
    let cls = "slot";
    if(range){
      if(now >= range[0] && now <= range[1]) cls += " now";
      else if(now > range[1]) cls += " past";
    }
    return `
      <div class="${cls}" style="--i:${i}" onclick="openSlot('${person}', ${i})"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); openSlot('${person}', ${i});}"
           tabindex="0" role="button" aria-haspopup="dialog">
        <div class="time">${it.t}</div>
        <div class="what"><b>${it.w}</b><span>${it.d}</span></div>
      </div>`;
  }).join("");
}

function render(){
  const wIdx = weekdayIndex(currentDate);
  dom.dayTitle.textContent =
    dateList.find(d=>d[0]===currentDate)[1] + " · " + weekdayNames[wIdx]
    + (currentDate===TODAY ? " · сегодня" : "");

  const aItems = andrey[currentDate] || [];
  dayItems.andrey = aItems;
  renderSlots(dom.andreySlots, aItems, "Пар нет — весь день свободен", 'andrey');
  dom.andreyFree.textContent = freeTagText(aItems, "весь день", "занят весь день");

  // Расписание Ани подтверждено на весь период 1–13 сентября, но
  // чередуется по неделям — выбираем нужный объект по дате.
  const anyaKnown = currentDate <= ANYA_SCHEDULE_KNOWN_UNTIL;
  const anyaSchedule = currentDate < ANYA_WEEK_SWITCH ? anyaWeek1 : anyaWeek2;
  const anItems = anyaKnown ? (anyaSchedule[wIdx] || []) : [];
  dayItems.anya = anItems;
  renderSlots(dom.anyaSlots, anItems, anyaKnown ? "Пар нет — весь день свободна" : "Расписание пока не опубликовано", 'anya');
  dom.anyaFree.textContent = anyaKnown ? freeTagText(anItems, "весь день", "занята весь день") : "неизвестно";

  const note = dom.meetNote;
  const bothFree = aItems.length===0 && anItems.length===0 && anyaKnown;
  if(bothFree){
    note.innerHTML = `<b>Оба свободны весь день</b> — хороший день, чтобы встретиться, например в Зеленограде-Крюкове. Электричка Подсолнечная → Крюково идёт по тому же Ленинградскому направлению.`;
  } else {
    const aPhrase = aItems.length===0 ? "свободен весь день"
      : (lastEnd(aItems) ? `освобождается к <b>${lastEnd(aItems)}</b>` : "занят весь день");
    const anPhrase = !anyaKnown ? "расписание пока не опубликовано"
      : anItems.length===0 ? "свободна весь день"
      : (lastEnd(anItems) ? `освобождается к <b>${lastEnd(anItems)}</b>` : "занята весь день");
    note.innerHTML = `Андрей ${aPhrase}, Аня ${anPhrase}.`;
  }
  replayAnim(note);
}

function openSlot(person, idx){
  const it = dayItems[person] && dayItems[person][idx];
  if(!it) return;
  lastFocused = document.activeElement;

  dom.sheet.classList.remove('andrey','anya');
  dom.sheet.classList.add(person);
  dom.sheetTime.textContent = it.t;
  dom.sheetTitle.textContent = it.w;
  dom.sheetMeta.innerHTML = it.d.split("·").map(part=>{
    const trimmed = part.trim();
    const full = teacherFullNames[trimmed];
    return `<span>${full || trimmed}</span>`;
  }).join("");

  dom.sheetScrim.classList.add('open');
  dom.sheet.classList.add('open');
  dom.sheet.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  dom.sheet.querySelector('.sheet-close').focus({preventScroll:true});
}

function closeSheet(){
  if(!dom.sheet.classList.contains('open')) return;
  dom.sheetScrim.classList.remove('open');
  dom.sheet.classList.remove('open');
  dom.sheet.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if(lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus({preventScroll:true});
}

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeSheet();
});

// Drag the sheet (or its grabber) down to dismiss, like a native bottom sheet.
(function initSheetDrag(){
  let startY = 0, dragging = false, sheetHeight = 0;
  const start = (y)=>{
    dragging = true;
    startY = y;
    sheetHeight = dom.sheet.getBoundingClientRect().height;
    dom.sheet.classList.add('dragging');
  };
  const move = (y)=>{
    if(!dragging) return;
    const delta = Math.max(0, y - startY);
    dom.sheet.style.transform = `translate(-50%, ${delta}px)`;
  };
  const end = (y)=>{
    if(!dragging) return;
    dragging = false;
    dom.sheet.classList.remove('dragging');
    dom.sheet.style.transform = '';
    const delta = Math.max(0, y - startY);
    if(delta > sheetHeight * 0.28){
      closeSheet();
    }
  };
  dom.sheetGrabber.addEventListener('pointerdown', e=>start(e.clientY));
  window.addEventListener('pointermove', e=>{ if(dragging) move(e.clientY); });
  window.addEventListener('pointerup', e=>end(e.clientY));
  window.addEventListener('pointercancel', ()=>{ dragging=false; dom.sheet.classList.remove('dragging'); dom.sheet.style.transform=''; });
})();

const menuSets = [
  {data: menuPodsolnechnayaMoskva, arrLabel: "Москва", note: "Время прибытия в Москву — фактическое, по данным Яндекс.Расписаний.", showAlabushevo: false, liveUrl: "https://rasp.yandex.ru/suburban/podsolnechnaya--moscow-oktyabrskaya/today"},
  {data: menuMoscowPodsolnechnaya, arrLabel: "Подсолнечная", note: "Отмечены рейсы, которые заезжают в Алабушево.", showAlabushevo: true, liveUrl: "https://rasp.yandex.ru/suburban/moscow--solnechnogorsk"},
  {data: menuMoscowKryukovo, arrLabel: "Зеленоград", note: "Отмечены рейсы, которые заезжают в Алабушево.", showAlabushevo: true, liveUrl: "https://rasp.yandex.ru/suburban/moscow-oktyabrskaya--kryukovo-train-station/today"},
];
let currentMenu = 0;

function setMenu(i){
  currentMenu = i;
  document.querySelectorAll('.menu-tab').forEach((el,idx)=>{
    el.classList.toggle('active', idx===i);
    el.setAttribute('aria-selected', idx===i ? 'true':'false');
  });
  dom.menuIndicator.style.transform = `translateX(${i * 100}%)`;
  renderMenu();
}

function trainType(cat){
  return cat || "";
}

function durationText(dep, arr){
  const [dh,dm] = dep.split(":").map(Number);
  const [ah,am] = arr.split(":").map(Number);
  let diff = (ah*60+am) - (dh*60+dm);
  if(diff < 0) diff += 24*60;
  const h = Math.floor(diff/60), m = diff%60;
  return h>0 ? `${h}ч${m ? ' '+m+'м' : ''}` : `${m}м`;
}

function renderMenu(){
  const set = menuSets[currentMenu];
  const now = minutesNow();
  // Mark the single next departure so it's obvious at a glance which
  // train to run for, and fade out ones that have already left today.
  let nextIdx = -1, nextDiff = Infinity;
  set.data.forEach(([,,dep], i)=>{
    const [h,m] = dep.split(":").map(Number);
    const diff = h*60+m - now;
    if(diff >= 0 && diff < nextDiff){ nextDiff = diff; nextIdx = i; }
  });
  dom.menuList.innerHTML = set.data.map(([num,cat,dep,arr,dest,alabushevo], i)=>{
    const [h,m] = dep.split(":").map(Number);
    const isPast = (h*60+m) < now;
    const isNext = i === nextIdx;
    let cls = "menu-row";
    if(isPast) cls += " past";
    if(isNext) cls += " next";
    return `
    <div class="${cls}" style="--i:${i}">
      <div class="num">№${num}${trainType(cat)}</div>
      <div class="dep">${dep}</div>
      <div class="arrow">→</div>
      <div class="arr">${arr}</div>
      <div class="dest">${durationText(dep,arr)}</div>
      ${isNext ? `<div class="soon-tag">через ${nextDiff} мин</div>` : ''}
      ${set.showAlabushevo ? `<div class="alab ${alabushevo ? 'yes':'no'}">${alabushevo ? '✓':'—'}</div>` : ''}
    </div>`;
  }).join("");
}

const THEME_KEY = 'schedule-theme-andrey-anya';
const THEMES = [
  {id:'mocha',      name:'Мокко',      bg:'#1a1512', a:'#d3a86a', b:'#d1657b'},
  {id:'terracotta', name:'Терракота', bg:'#f1e3d0', a:'#6b5a3a', b:'#a34b2b'},
];

function currentThemeId(){
  return document.documentElement.getAttribute('data-theme') || 'mocha';
}

function applyTheme(id, persist){
  document.documentElement.setAttribute('data-theme', id);
  if(persist){
    try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  }
  dom.themeSwitcher.querySelectorAll('.theme-swatch').forEach(el=>{
    const isActive = el.dataset.theme === id;
    el.classList.toggle('active', isActive);
    el.setAttribute('aria-pressed', String(isActive));
  });
  const meta = document.getElementById('themeColorMeta');
  const theme = THEMES.find(t=>t.id===id);
  if(meta && theme) meta.setAttribute('content', theme.bg);
}

function buildThemeSwitcher(){
  const frag = document.createDocumentFragment();
  THEMES.forEach(t=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-swatch';
    btn.dataset.theme = t.id;
    btn.title = t.name;
    btn.setAttribute('aria-label', t.name);
    btn.setAttribute('aria-pressed', 'false');
    btn.style.background = `linear-gradient(135deg, ${t.bg} 40%, ${t.a} 70%, ${t.b} 100%)`;
    btn.onclick = ()=> applyTheme(t.id, true);
    frag.appendChild(btn);
  });
  dom.themeSwitcher.innerHTML = '';
  dom.themeSwitcher.appendChild(frag);
  applyTheme(currentThemeId(), false);
}

function initBoard(){
  buildThemeSwitcher();
  buildRail();
  render();
  renderMenu();
  document.querySelectorAll('.drop-in, .rise-in').forEach(el=>{
    el.addEventListener('animationend', function handler(){
      el.classList.remove('drop-in','rise-in','d1','d2','d3');
      el.removeEventListener('animationend', handler);
    });
  });
  // Keep the "сейчас" / "следующая электричка" highlights accurate without
  // needing a manual refresh — re-render just the parts that depend on
  // the clock, once a minute, and again when the tab regains focus.
  window.setInterval(()=>{ render(); renderMenu(); }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){ render(); renderMenu(); }
  });
}

initBoard();
