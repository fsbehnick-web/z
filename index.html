<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табло — Андрей и Аня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d131c;
    --panel: #151d29;
    --panel-2: #1a2431;
    --line: #26313f;
    --andrey: #c7c0b0;
    --andrey-dim: #948a78;
    --andrey-soft: rgba(199,192,176,0.10);
    --anya: #c34f68;
    --anya-dim: #7f3247;
    --anya-soft: rgba(195,79,104,0.14);
    --text: #eceae0;
    --text-dim: #8a9199;
    --free: #7fd88f;
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  body.theme-beige{
    --bg: #f3ead9;
    --panel: #fcf7ec;
    --panel-2: #efe2ca;
    --line: #ddccac;
    --andrey: #6b4a35;
    --andrey-dim: #8f6c52;
    --andrey-soft: rgba(107,74,53,0.10);
    --anya: #7a2740;
    --anya-dim: #a8607a;
    --anya-soft: rgba(122,39,64,0.10);
    --text: #382f24;
    --text-dim: #85765c;
    --free: #4f7a4a;
    --shadow: 0 10px 26px -14px rgba(80,60,20,0.28);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 28px 16px 60px;
    -webkit-font-smoothing: antialiased;
    transition: background-color .4s var(--ease), color .3s var(--ease);
  }
  .wrap{max-width: 800px; margin: 0 auto;}

  body, .col, .meet-note, .menu-board, .date-pill, .theme-toggle, .menu-tabs, .slot{
    transition: background-color .35s var(--ease), border-color .35s var(--ease), color .25s var(--ease), box-shadow .35s var(--ease) !important;
  }

  @keyframes dropIn{
    from{ opacity:0; transform: translateY(-10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes slotIn{
    from{ opacity:0; transform: translateY(12px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes pillPop{
    0%{ transform: scale(.90); }
    55%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .drop-in{
    opacity:0;
    animation: dropIn .45s var(--ease) forwards;
    will-change: opacity, transform;
  }
  .drop-in.d1{ animation-delay: .04s; }
  .drop-in.d2{ animation-delay: .1s; }
  .drop-in.d3{ animation-delay: .16s; }
  .rise-in{
    opacity:0;
    animation: riseIn .45s var(--ease) forwards;
    will-change: opacity, transform;
  }
  .rise-in.d1{ animation-delay: .14s; }
  .rise-in.d2{ animation-delay: .2s; }
  .rise-in.d3{ animation-delay: .26s; }

  .board-header{
    text-align:center;
    padding: 6px 10px 26px;
    margin-bottom: 20px;
    position:relative;
  }
  .board-header::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    transform: translateX(-50%);
    width:64px; height:2px;
    background: linear-gradient(90deg, var(--andrey), var(--anya));
    border-radius: 2px;
    opacity:.55;
  }
  .board-header .kicker{
    letter-spacing: 2.5px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight:600;
    text-transform:uppercase;
  }
  .board-header h1{
    font-weight: 800;
    font-size: clamp(26px, 6vw, 36px);
    margin: 8px 0 6px;
    letter-spacing: 0.5px;
    background: linear-gradient(100deg, var(--andrey) 20%, var(--text) 55%, var(--anya) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .board-header p{
    margin:0;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .theme-toggle{
    margin-top: 16px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 12px;
    font-weight:600;
    cursor: pointer;
    transition: border-color .25s var(--ease), color .25s var(--ease), transform .15s var(--ease);
  }
  .theme-toggle:hover{ color: var(--text); border-color: var(--andrey-dim); transform: translateY(-1px); }
  .theme-toggle:active{ transform: translateY(0) scale(.96); }

  .date-rail{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 4px 2px 14px;
    margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .date-rail::-webkit-scrollbar{ display:none; }
  .date-pill{
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 13px;
    border-radius: 10px;
    cursor: pointer;
    text-align:center;
    line-height:1.3;
    transition: border-color .25s var(--ease), color .25s var(--ease), transform .18s var(--ease), box-shadow .25s var(--ease), background-color .25s var(--ease);
  }
  .date-pill:hover{ transform: translateY(-2px); border-color: var(--andrey-dim); }
  .date-pill:active{ transform: translateY(0) scale(.97); }
  .date-pill b{display:block; font-size:15.5px; color: var(--text); font-weight:700; transition: color .25s var(--ease);}
  .date-pill.active{
    border-color: var(--andrey);
    color: var(--andrey);
    background: var(--andrey-soft);
    box-shadow: 0 6px 16px -8px rgba(0,0,0,0.35);
  }
  .date-pill.active b{color: var(--andrey);}
  .date-pill.off b{color: var(--text-dim);}
  .date-pill.pop{ animation: pillPop .4s cubic-bezier(.34,1.56,.64,1); }

  .day-title{
    font-size: 14.5px;
    font-weight:600;
    color: var(--text-dim);
    text-align:center;
    margin: 0 0 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .content-swap{
    transition: opacity .24s var(--ease), transform .24s var(--ease);
  }
  .content-swap.swapping{ opacity:0; transform: translateY(6px); }

  .columns{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 560px){
    .columns{grid-template-columns: 1fr;}
  }

  .col{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
    box-shadow: var(--shadow);
  }
  .col-head{
    padding: 13px 16px;
    font-weight:700;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
  }
  .col-head::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:3px;
  }
  .col.andrey .col-head{ color: var(--andrey); }
  .col.andrey .col-head::before{ background: linear-gradient(90deg, var(--andrey-dim), var(--andrey)); }
  .col.anya .col-head{ color: var(--anya); }
  .col.anya .col-head::before{ background: linear-gradient(90deg, var(--anya-dim), var(--anya)); }
  .col-head .free-tag{
    font-size:11px;
    color: var(--free);
    font-weight:600;
  }

  .slot{
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    display:flex;
    gap:10px;
    animation: slotIn .4s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 0.045s);
    will-change: opacity, transform;
  }
  .slot:hover{ background: var(--panel-2); }
  .slot:last-child{border-bottom:none;}
  .slot .time{
    color: var(--text-dim);
    flex: 0 0 84px;
    font-size:12px;
    font-weight:600;
    padding-top:1px;
  }
  .slot .what b{display:block; color: var(--text); font-size:13px; font-weight:600;}
  .slot .what span{color: var(--text-dim); font-size:12px;}
  .empty-day{
    padding: 26px 14px;
    text-align:center;
    color: var(--free);
    font-size:13px;
    font-weight:600;
    animation: slotIn .45s var(--ease) both;
  }

  .meet-note{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 26px;
    box-shadow: var(--shadow);
    animation: slotIn .45s var(--ease) both;
    animation-delay: .1s;
  }
  .meet-note b{color: var(--text);}

  .menu-board{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 16px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .menu-board h2{
    font-size: 13.5px;
    letter-spacing:1px;
    color: var(--andrey);
    margin: 0 0 4px;
    font-weight:800;
  }
  .menu-sub{
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 14px;
    line-height: 1.5;
  }
  .menu-tabs{
    position:relative;
    display:flex;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
  }
  .menu-tab-indicator{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width: calc((100% - 8px) / 3);
    background: var(--anya);
    border-radius: 8px;
    transition: transform .35s var(--ease);
    z-index:0;
  }
  .menu-tab{
    position:relative;
    z-index:1;
    flex:1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 12px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition: color .35s var(--ease);
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .menu-tab.active{ color: var(--bg); }
  .menu-list{
    max-height: 340px;
    overflow-y: auto;
    border-top: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent;
  }
  .menu-list::-webkit-scrollbar{width:6px;}
  .menu-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .menu-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    transition: background-color .2s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .menu-row:hover{ background: var(--panel-2); }
  .menu-row .num{
    flex: 0 0 52px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight:600;
  }
  .menu-row .dep{
    flex: 0 0 52px;
    font-weight:700;
    color: var(--andrey);
  }
  .menu-row .arrow{ color: var(--text-dim); flex: 0 0 14px; text-align:center;}
  .menu-row .arr{
    flex: 0 0 52px;
    font-weight:700;
    color: var(--anya);
  }
  .menu-row .dest{
    flex: 1;
    color: var(--text-dim);
    font-size: 12px;
    text-align:right;
  }
  .menu-row .alab{
    flex: 0 0 20px;
    font-size: 13px;
    text-align:center;
  }
  .menu-row .alab.yes{ color: var(--free); }
  .menu-row .alab.no{ color: var(--text-dim); }
  .lock-screen{
    position:fixed;
    inset:0;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 999;
    padding: 20px;
    transition: opacity .3s var(--ease);
  }
  .lock-screen.hidden{
    opacity:0;
    pointer-events:none;
  }
  .lock-box{
    width:100%;
    max-width: 300px;
    text-align:center;
  }
  .lock-kicker{
    letter-spacing: 2px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight:600;
    text-transform:uppercase;
    margin-bottom: 10px;
  }
  .lock-title{
    color: var(--text);
    font-size: 19px;
    font-weight:700;
    margin-bottom: 18px;
  }
  .lock-input{
    width:100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 18px;
    text-align:center;
    letter-spacing: 4px;
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
    outline:none;
    transition: border-color .2s var(--ease);
  }
  .lock-input:focus{ border-color: var(--andrey); }
  .lock-btn{
    width:100%;
    background: var(--anya);
    border:none;
    color:#fff;
    font-family: inherit;
    font-size: 14px;
    font-weight:700;
    padding: 12px 14px;
    border-radius: 12px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .2s var(--ease), transform .15s var(--ease);
  }
  .lock-btn:hover{ opacity:.9; }
  .lock-btn:active{ transform: scale(.97); }
  .lock-error{
    color: var(--anya);
    font-size: 12.5px;
    margin-top: 12px;
    opacity:0;
    transition: opacity .2s var(--ease);
  }
  .lock-error.show{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-kicker">Расписание — Андрей &amp; Аня</div>
    <div class="lock-title">Введите пароль</div>
    <input type="password" id="lockInput" class="lock-input" inputmode="numeric" autocomplete="off" autofocus>
    <button class="lock-btn" onclick="checkPassword()">Войти</button>
    <div class="lock-error" id="lockError">Неверный пароль, попробуйте ещё раз</div>
  </div>
</div>

<div class="wrap" id="pageWrap" style="display:none;">

  <div class="board-header">

    <p class="drop-in d3">1–13 сентября 2026 — период адаптационного модуля</p>
    <button id="themeToggle" class="theme-toggle drop-in d3" onclick="toggleTheme()">Бежевая тема</button>
  </div>

  <div class="rise-in d1">
    <div class="date-rail" id="dateRail"></div>
    <div class="day-title" id="dayTitle"></div>
  </div>

  <div class="content-swap rise-in d2" id="daySwap">
    <div class="columns">
      <div class="col andrey">
        <div class="col-head"><span>Андрей — МПГУ</span><span class="free-tag" id="andreyFree"></span></div>
        <div id="andreySlots"></div>
      </div>
      <div class="col anya">
        <div class="col-head"><span>Аня — МИЭТ (УТС-11)</span><span class="free-tag" id="anyaFree"></span></div>
        <div id="anyaSlots"></div>
      </div>
    </div>

    <div class="meet-note" id="meetNote"></div>
  </div>

  <div class="menu-board rise-in d3">
    <h2>МЕНЮ ЭЛЕКТРИЧЕК — НА КАКОЙ УЕХАТЬ</h2>
    <p class="menu-sub">п — пригородная, к — «Ласточка Комфорт», э — «Ласточка Экспресс»</p>
    <div class="menu-tabs">
      <div class="menu-tab-indicator" id="menuIndicator"></div>
      <button class="menu-tab active" onclick="setMenu(0)">Подсолнечная → Москва</button>
      <button class="menu-tab" onclick="setMenu(1)">Москва → Подсолнечная</button>
      <button class="menu-tab" onclick="setMenu(2)">Москва → Зеленоград</button>
    </div>
    <div class="menu-list" id="menuList"></div>
  </div>

</div>

const weekdayNames = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];

let currentDate = "2026-09-01";

function weekdayIndex(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.getDay();
}

function lastEnd(items){
  if(!items || items.length===0) return null;
  const last = items[items.length-1];
  const parts = last.t.split("–");
  return parts.length===2 ? parts[1].trim() : null;
}

function freeTagText(items, allDayFreeText, busyAllDayText){
  if(items.length===0) return allDayFreeText;
  const end = lastEnd(items);
  return end ? `до ${end}` : busyAllDayText;
}

function buildRail(){
  const rail = document.getElementById('dateRail');
  rail.innerHTML = "";
  dateList.forEach(([iso,label,wd])=>{
    const pill = document.createElement('div');
    pill.className = 'date-pill' + (iso===currentDate ? ' active':'') + ((wd==="Сб"||wd==="Вс")?' off':'');
    pill.dataset.iso = iso;
    pill.innerHTML = `<b>${label}</b>${wd}`;
    pill.onclick = ()=>{ if(iso!==currentDate){ currentDate = iso; goToDate(); } };
    rail.appendChild(pill);
  });
}

function replayAnim(el){
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

function updateActivePill(){
  document.querySelectorAll('.date-pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.iso === currentDate);
  });
  const activePill = document.querySelector('.date-pill.active');
  if(activePill){
    replayAnim(activePill);
    activePill.classList.remove('pop');
    void activePill.offsetWidth;
    activePill.classList.add('pop');
    activePill.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }
}

function goToDate(){
  updateActivePill();
  const swap = document.getElementById('daySwap');
  swap.classList.add('swapping');
  window.setTimeout(()=>{
    render();
    requestAnimationFrame(()=>{ swap.classList.remove('swapping'); });
  }, 220);
}

function render(){
  const wIdx = weekdayIndex(currentDate);
  document.getElementById('dayTitle').textContent =
    dateList.find(d=>d[0]===currentDate)[1] + " · " + weekdayNames[wIdx];

  const aItems = andrey[currentDate] || [];
  const andreySlotsEl = document.getElementById('andreySlots');
  if(aItems.length===0){
    andreySlotsEl.innerHTML = `<div class="empty-day">Пар нет — весь день свободен</div>`;
  } else {
    andreySlotsEl.innerHTML = aItems.map((it,i)=>`
      <div class="slot" style="--i:${i}">
        <div class="time">${it.t}</div>
        <div class="what"><b>${it.w}</b><span>${it.d}</span></div>
      </div>`).join("");
  }
  document.getElementById('andreyFree').textContent = freeTagText(aItems, "весь день", "занят весь день");

  const anItems = anya[wIdx] || [];
  const anyaSlotsEl = document.getElementById('anyaSlots');
  if(anItems.length===0){
    anyaSlotsEl.innerHTML = `<div class="empty-day">Пар нет — весь день свободна</div>`;
  } else {
    anyaSlotsEl.innerHTML = anItems.map((it,i)=>`
      <div class="slot" style="--i:${i}">
        <div class="time">${it.t}</div>
        <div class="what"><b>${it.w}</b><span>${it.d}</span></div>
      </div>`).join("");
  }
  document.getElementById('anyaFree').textContent = freeTagText(anItems, "весь день", "занята весь день");

  const note = document.getElementById('meetNote');
  const bothFree = aItems.length===0 && anItems.length===0;
  if(bothFree){
    note.innerHTML = `<b>Оба свободны весь день</b> — хороший день, чтобы встретиться, например в Зеленограде-Крюкове. Электричка Подсолнечная → Крюково идёт по тому же Ленинградскому направлению.`;
  } else {
    const aPhrase = aItems.length===0 ? "свободен весь день"
      : (lastEnd(aItems) ? `освобождается к <b>${lastEnd(aItems)}</b>` : "занят весь день");
    const anPhrase = anItems.length===0 ? "свободна весь день"
      : (lastEnd(anItems) ? `освобождается к <b>${lastEnd(anItems)}</b>` : "занята весь день");
    note.innerHTML = `Андрей ${aPhrase}, Аня ${anPhrase}.`;
  }
  replayAnim(note);
}

const menuSets = [
  {data: menuPodsolnechnayaMoskva, arrLabel: "Москва", note: "Время прибытия в Москву — фактическое, по данным Яндекс.Расписаний.", showAlabushevo: false, liveUrl: "https://rasp.yandex.ru/suburban/podsolnechnaya--moscow-oktyabrskaya/today"},
  {data: menuMoscowPodsolnechnaya, arrLabel: "Подсолнечная", note: "Отмечены рейсы, которые заезжают в Алабушево.", showAlabushevo: true, liveUrl: "https://rasp.yandex.ru/suburban/moscow--solnechnogorsk"},
  {data: menuMoscowKryukovo, arrLabel: "Зеленоград", note: "Отмечены рейсы, которые заезжают в Алабушево.", showAlabushevo: true, liveUrl: "https://rasp.yandex.ru/suburban/moscow-oktyabrskaya--kryukovo-train-station/today"},
];
let currentMenu = 0;

function setMenu(i){
  currentMenu = i;
  document.querySelectorAll('.menu-tab').forEach((el,idx)=>el.classList.toggle('active', idx===i));
  document.getElementById('menuIndicator').style.transform = `translateX(${i * 100}%)`;
  renderMenu();
}

function trainType(cat){
  return cat || "";
}

function durationText(dep, arr){
  const [dh,dm] = dep.split(":").map(Number);
  const [ah,am] = arr.split(":").map(Number);
  let diff = (ah*60+am) - (dh*60+dm);
  if(diff < 0) diff += 24*60;
  const h = Math.floor(diff/60), m = diff%60;
  return h>0 ? `${h} ч ${m ? m+' м':''}`.trim() : `${m} м`;
}

function renderMenu(){
  const set = menuSets[currentMenu];
  const list = document.getElementById('menuList');
  list.innerHTML = set.data.map(([num,cat,dep,arr,dest,alabushevo])=>`
    <div class="menu-row">
      <div class="num">№${num}${trainType(cat)}</div>
      <div class="dep">${dep}</div>
      <div class="arrow">→</div>
      <div class="arr">${arr}</div>
      <div class="dest">${durationText(dep,arr)}</div>
      ${set.showAlabushevo ? `<div class="alab ${alabushevo ? 'yes':'no'}">${alabushevo ? '✓':'—'}</div>` : ''}
    </div>`).join("");
}

function toggleTheme(){
  const isBeige = document.body.classList.toggle('theme-beige');
  document.getElementById('themeToggle').textContent = isBeige ? 'Тёмная тема' : 'Бежевая тема';
}

function initBoard(){
  buildRail();
  render();
  renderMenu();
  document.querySelectorAll('.drop-in, .rise-in').forEach(el=>{
    el.addEventListener('animationend', function handler(){
      el.classList.remove('drop-in','rise-in','d1','d2','d3');
      el.removeEventListener('animationend', handler);
    });
  });
}

const SITE_PASSWORD = "04";

function unlock(){
  document.getElementById('pageWrap').style.display = '';
  const lock = document.getElementById('lockScreen');
  lock.classList.add('hidden');
  window.setTimeout(()=>{ lock.style.display = 'none'; }, 300);
  initBoard();
}

function checkPassword(){
  const input = document.getElementById('lockInput');
  if(input.value === SITE_PASSWORD){
    sessionStorage.setItem('boardUnlocked', '1');
    unlock();
  } else {
    document.getElementById('lockError').classList.add('show');
    input.value = '';
    input.focus();
  }
}

document.getElementById('lockInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkPassword();
});

if(sessionStorage.getItem('boardUnlocked') === '1'){
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('pageWrap').style.display = '';
  initBoard();
}
